<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XELISTIC — Artworks</title>
<link rel="icon" type="image/svg+xml" href="/Img/icon.svg">
<link rel="alternate icon" href="/Img/icon.ico">
<link rel="apple-touch-icon" href="/Img/icon.svg">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/artworks.css">
<link rel="stylesheet" href="/css/terminal-bg.css">
</head>
<body>
<div class="page-terminal" id="pageTerminal" aria-hidden="true"></div>

<nav>
  <a class="nav-logo" href="/">
    <img src="/Img/icon.svg" class="nav-mark" alt="">
    XELISTIC
  </a>
  <ul>
    <li><a href="/Artworks" class="active">Artworks</a></li>
  </ul>
</nav>

<header class="page-header">
  <div>
    <div class="page-eyebrow">Originale Werke</div>
    <h1 class="page-title">Art<em>works</em></h1>
  </div>
  <div class="page-meta">
    © 2026<br>
    Alle Rechte vorbehalten
  </div>
</header>

<div class="filter-bar" role="toolbar" aria-label="Kategorie filtern">
  <button class="filter-btn active" data-filter="all">Alle</button>
  <button class="filter-btn" data-filter="illustration">Illustration</button>
  <button class="filter-btn" data-filter="animation">Animation</button>
  <button class="filter-btn" data-filter="sketch">Sketch</button>
</div>

<div class="gallery-wrap">
  <div class="gallery-grid" id="gallery">

    <div class="artwork-item" data-category="sketch" data-title="Artwork 01" data-tag="Sketch">
      <span class="artwork-num">01</span>
      <div class="artwork-overlay"></div>
      <img src="/Img/Artworks/988898437473.png" alt="" class="artwork-img" draggable="false">
      <div class="artwork-info">
        <div class="artwork-title">Artwork 01</div>
        <div class="artwork-tag">Sketch</div>
      </div>
    </div>

    <div class="artwork-item" data-category="illustration" data-title="Artwork 02" data-tag="Illustration">
      <span class="artwork-num">02</span>
      <div class="artwork-overlay"></div>
      <img src="/Img/Artworks/7483748374.jpg" alt="" class="artwork-img" draggable="false">
      <div class="artwork-info">
        <div class="artwork-title">Artwork 02</div>
        <div class="artwork-tag">Illustration</div>
      </div>
    </div>

    <div class="artwork-item" data-category="illustration" data-title="Artwork 03" data-tag="Illustration">
      <span class="artwork-num">03</span>
      <div class="artwork-overlay"></div>
      <img src="/Img/Artworks/6664563234723.jpg" alt="" class="artwork-img" draggable="false">
      <div class="artwork-info">
        <div class="artwork-title">Artwork 03</div>
        <div class="artwork-tag">Illustration</div>
      </div>
    </div>

    <!-- Neues Artwork: Schema kopieren und Nummer + Pfad anpassen -->

  </div>
  <p class="gallery-empty" id="gallery-empty">Keine Werke in dieser Kategorie.</p>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork Ansicht">
  <button class="lightbox-close" id="lb-close">✕ Schließen</button>
  <button class="lightbox-nav lightbox-prev" id="lb-prev">←</button>
  <button class="lightbox-nav lightbox-next" id="lb-next">→</button>
  <div class="lightbox-inner">
    <canvas class="lightbox-canvas" id="lb-canvas"></canvas>
  </div>
  <div class="lightbox-meta">
    <div class="lightbox-title" id="lb-title"></div>
    <div class="lightbox-tag" id="lb-tag"></div>
  </div>
</div>

<footer class="page-footer">
  <span class="footer-left">© 2026 Xelistic — All rights reserved</span>
  <div class="footer-right">
    <a href="/Impressum">Impressum</a>
    <a href="/Datenschutz">Datenschutz</a>
  </div>
</footer>

<script src="/js/copy-protection.js"></script>
<script src="/js/artworks.js"></script>
<script src="/js/terminal-bg.js" defer></script>

</body>
</html>
